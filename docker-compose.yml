services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fundlok_dev
      POSTGRES_USER: fundlok
      POSTGRES_PASSWORD: fundlok
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    ports:
      - "8025:8025" 
      - "1025:1025" 
    environment:
      MP_MAX_MESSAGES: 5000

  # Local stand-in for Upstash Redis (deployed environments). The app speaks
  # plain Redis protocol (ARQ), which Upstash also serves over TLS, so going
  # from here to Upstash is only a REDIS_URL change -- see .env.example.
  # `--save 60 1` snapshots to the redis_data volume so queued jobs survive
  # `docker compose down`.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # MinIO stopped publishing official images (quay.io/minio/minio and
    # docker.io/minio/minio now return 401/denied). pgsty/minio is a
    # community-maintained drop-in fork with the same CLI and console.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: minio
    ports:
      - "9000:9000"   # S3 API port
      - "9001:9001"   # Web UI console port
    environment:
      MINIO_ROOT_USER: "minioadmin"
      MINIO_ROOT_PASSWORD: "minioadmin"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  # Malware scanner for uploads (compliance audit SEC-04). The ARQ worker
  # streams each uploaded file to clamd on 3310 (app/uploads/scanning.py).
  # clamav-debian, not clamav/clamav: the latter has no arm64 build.
  # The first start downloads the signature database, so allow a few minutes
  # before scans answer. Limits are raised past the largest upload (200 MB);
  # AlertExceedsMax makes anything bigger a reported hit instead of a silent
  # "OK", which the app records as SCAN_FAILED.
  clamav:
    image: clamav/clamav-debian:1.4
    restart: unless-stopped
    ports:
      - "3310:3310"
    environment:
      CLAMD_CONF_StreamMaxLength: "210M"
      CLAMD_CONF_MaxFileSize: "210M"
      CLAMD_CONF_MaxScanSize: "1000M"
      CLAMD_CONF_AlertExceedsMax: "yes"
    volumes:
      - clamav_db:/var/lib/clamav

  # Full-container run of the API (used by `bun run docker:up`). For day-to-day
  # dev prefer `bun run dev` (uvicorn on the host with hot reload). The
  # entrypoint runs `alembic upgrade head` before starting uvicorn.
  api:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8080"
    env_file:
      - .env
    environment:
      # Override .env values that point at host "localhost" so they resolve on
      # the compose network instead.
      DATABASE_URL: postgresql+asyncpg://fundlok:fundlok@postgres:5432/fundlok_dev
      REDIS_URL: redis://redis:6379/0
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      PORT: "8080"
    depends_on:
      postgres:
        condition: service_healthy

  # ARQ worker (T2, HANDOFF-03 Issue 8) -- runs the daily repayment batch
  # and ML scoring jobs registered on app.scheduler.worker.WorkerSettings.
  # Separate process from `api`; both share the same image and .env.
  worker:
    build: .
    restart: unless-stopped
    command: ["arq", "app.scheduler.worker.WorkerSettings"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://fundlok:fundlok@postgres:5432/fundlok_dev
      REDIS_URL: redis://redis:6379/0
      CLAMAV_HOST: clamav
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_started

  pgweb:
    image: sosedoff/pgweb:latest
    container_name: pgweb
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      PGWEB_DATABASE_URL: postgres://fundlok:fundlok@postgres:5432/fundlok_dev?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
  redis_data:
  clamav_db:
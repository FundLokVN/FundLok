# Backend CI/CD — single pipeline for tests AND deploys (one mechanism only;
# the console-created Cloud Build trigger has been deleted, see
# docs/deployment/ci-cd-pipeline.md).
#
#   PR to preview / main  -> migration check + tests + dependency audit + image scan
#   push to preview       -> migration check + tests + dependency audit + image scan -> deploy "staging"
#   push to main          -> migration check + tests + dependency audit + image scan -> deploy "prod-api"
#   nightly on main       -> dependency audit + image scan only; never deploys
#
# Deploy jobs are gated with
# `needs: [migration-check, tests, dependency-audit, image-scan]`
# — deployment only runs when all CI pipelines pass.
# Google Cloud auth is keyless via Workload Identity Federation.
#
# Required GitHub repository secrets:
#   SECRET_KEY          production JWT signing key
#   STAGING_SECRET_KEY  staging JWT signing key (must differ from prod)
#   STG_DB              staging DATABASE_URL
# Production DATABASE_URL is intentionally NOT set here — it lives on the
# prod-api Cloud Run service config and survives deploys because
# deploy-cloudrun@v2 merges env_vars (see commit 36ad182).

name: Backend CI/CD

on:
  push:
    branches: [ "main", "preview" ]
  pull_request:
    branches: [ "main", "preview" ]
  # New advisories are published with no change to our code (dnspython
  # CVE-2026-128089 appeared between two pushes on 2026-11-13/14). The nightly
  # run re-scans main so they show up within a day, not at the next push.
  # 01:00 UTC is 08:00 in Vietnam. GitHub emails a scheduled run's failure to
  # whoever last changed this cron line.
  schedule:
    - cron: "0 1 * * *"

# One run at a time per branch; never cancel a deploy mid-flight.
# The nightly run gets its own group: it shares refs/heads/main with pushes,
# and a newer queued run cancels an older *pending* one in the same group,
# so it could otherwise cancel a prod deploy waiting its turn.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'nightly' || github.ref }}
  cancel-in-progress: false

jobs:
  migration-check:
    name: Check Schema Migrations
    runs-on: ubuntu-latest
    # Code checks: nothing changes overnight, so the nightly scan skips them.
    if: github.event_name != 'schedule'

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg2://test_user:test_password@localhost:5432/test_db
      SECRET_KEY: dummy_secret_key_for_testing
      DEBUG: True

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Alembic migrations to head
        run: alembic upgrade head

      - name: Check for missing migrations
        # alembic check compares the database schema with the SQLAlchemy models.
        # It will exit with an error code if the models contain changes that
        # haven't been generated in a migration script.
        run: alembic check

  tests:
    name: Run Test Suite
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # No job-level DATABASE_URL: Alembic (sync psycopg2) and the app/tests
      # (async asyncpg, HANDOFF-02 Fix A) need different drivers, so each is
      # set per-step below instead of forcing one URL for both.
      SECRET_KEY: dummy_secret_key_for_testing
      DEBUG: True

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Alembic migrations to head
        env:
          DATABASE_URL: postgresql+psycopg2://test_user:test_password@localhost:5432/test_db
        run: alembic upgrade head

      - name: Run test suite
        env:
          DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/test_db
        run: pytest -q

  dependency-audit:
    name: Audit Dependencies
    runs-on: ubuntu-latest

    # Gates the deploy jobs (see their `needs:`). Deploys only trigger if all
    # CI checks, including this audit and the image scan, pass.

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # pipx keeps pip-audit's own dependencies out of the audited set, and
      # --no-deps is safe precisely because requirements.txt pins every
      # transitive too -- there is nothing left for it to resolve. Auditing
      # requirements-dev.txt covers both files: it includes requirements.txt.
      #
      # No suppressions: python-jose and ecdsa were removed for
      # CVE-2026-85394 / CVE-2024-23342 (both unfixed upstream); the JWT layer
      # is PyJWT now. If a new finding appears here, either fix the pin or add
      # a suppression with the same reasoning the old python-jose one had.
      - name: Audit pinned dependencies for known vulnerabilities
        run: |
          pipx run pip-audit==2.10.1 \
            --requirement requirements-dev.txt --no-deps --strict

  image-scan:
    name: Scan Container Image
    runs-on: ubuntu-latest

    # The audit above reads only requirements*.txt. Prod runs the image Cloud
    # Run builds from ./Dockerfile, so this builds that image and scans all of
    # it: the base image's Debian packages, the installed Python packages, and
    # any secret copied in by mistake.
    #
    # Fails only on HIGH/CRITICAL findings that have a fix (--ignore-unfixed).
    # python:3.12-slim carries ~200 Debian advisories with no released fix
    # (2026-11-14); nothing in this repo can fix those, and failing on them
    # would keep this job red forever. The first scan step lists every
    # fixable finding at any severity, for the log.
    #
    # trivy runs from its official image pinned by digest rather than through
    # a third-party action, so a re-pushed tag cannot change what runs here.
    # To upgrade: docker buildx imagetools inspect aquasec/trivy:<version>
    env:
      TRIVY_IMAGE: aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build the image Cloud Run deploys
        run: |
          docker build --pull -t fundlok-api:ci .
          docker save fundlok-api:ci -o "$RUNNER_TEMP/image.tar"

      - name: List fixable findings (all severities, report only)
        run: |
          docker run --rm -v "$RUNNER_TEMP:/scan" "$TRIVY_IMAGE" image \
            --input /scan/image.tar --cache-dir /scan/trivy-cache \
            --scanners vuln,secret --ignore-unfixed --exit-code 0 \
            --table-mode detailed

      - name: Fail on fixable HIGH/CRITICAL findings
        run: |
          docker run --rm -v "$RUNNER_TEMP:/scan" "$TRIVY_IMAGE" image \
            --input /scan/image.tar --cache-dir /scan/trivy-cache --skip-db-update \
            --scanners vuln,secret --ignore-unfixed \
            --severity HIGH,CRITICAL --exit-code 1 --table-mode detailed

  deploy-staging:
    name: Deploy to Cloud Run (staging)
    runs-on: ubuntu-latest
    needs: [migration-check, tests, dependency-audit, image-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/preview'

    permissions:
      contents: 'read'
      id-token: 'write'

    env:
      PROJECT_ID: 'fundlok'
      REGION: 'asia-southeast1'
      SERVICE: 'staging'

    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332' # actions/checkout@v4

      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@f112390a2df9932162083945e46d439060d66ec2' # google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/1086381007504/locations/global/workloadIdentityPools/fundlok/providers/github'
          service_account: 'github-deploy@fundlok.iam.gserviceaccount.com'

      - name: 'Deploy to Cloud Run'
        id: 'deploy'
        uses: 'google-github-actions/deploy-cloudrun@v2'
        with:
          service: '${{ env.SERVICE }}'
          region: '${{ env.REGION }}'
          project_id: '${{ env.PROJECT_ID }}'
          source: './'
          flags: '--add-cloudsql-instances fundlok:asia-southeast1:fundlok'
          env_vars: |
            SECRET_KEY=${{ secrets.STAGING_SECRET_KEY }}

      - name: 'Show output'
        run: |-
          echo ${{ steps.deploy.outputs.url }}

  deploy-production:
    name: Deploy to Cloud Run (prod-api)
    runs-on: ubuntu-latest
    needs: [migration-check, tests, dependency-audit, image-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: 'read'
      id-token: 'write'

    env:
      PROJECT_ID: 'fundlok'
      REGION: 'asia-southeast1'
      SERVICE: 'prod-api'

    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332' # actions/checkout@v4

      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@f112390a2df9932162083945e46d439060d66ec2' # google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/1086381007504/locations/global/workloadIdentityPools/fundlok/providers/github'
          service_account: 'github-deploy@fundlok.iam.gserviceaccount.com'

      - name: 'Deploy to Cloud Run'
        id: 'deploy'
        uses: 'google-github-actions/deploy-cloudrun@v2'
        with:
          service: '${{ env.SERVICE }}'
          region: '${{ env.REGION }}'
          project_id: '${{ env.PROJECT_ID }}'
          source: './'
          flags: '--add-cloudsql-instances fundlok:asia-southeast1:fundlok'
          env_vars: |
            SECRET_KEY=${{ secrets.SECRET_KEY }}

      - name: 'Show output'
        run: |-
          echo ${{ steps.deploy.outputs.url }}
